<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoja de inscripción</title>
</head>
<body>
  <h1>Hoja de inscripción</h1>
  <h2>En los ciclos formativos de grado superior</h2>
  <p><a href="../index.html">Volver al inicio</a></p>

  <form>
    <fieldset>
      <legend>Datos personales</legend>

      <p>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">
        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos">
        <label for="dni">DNI:</label>
        <input type="text" id="dni" name="dni">
      </p>

      <p>
        <label for="localidad">Localidad de nacimiento:</label>
        <input type="text" id="localidad" name="localidad">
        <label for="provincia">Provincia:</label>
        <select id="provincia" name="provincia">
          <option value="a-coruna">A Coruña</option>
          <option value="alava">Álava</option>
          <option value="albacete">Albacete</option>
          <option value="alicante">Alicante</option>
          <option value="almeria">Almería</option>
          <option value="asturias">Asturias</option>
          <option value="avila">Ávila</option>
          <option value="badajoz">Badajoz</option>
          <option value="barcelona">Barcelona</option>
          <option value="burgos">Burgos</option>
          <option value="caceres">Cáceres</option>
          <option value="cadiz">Cádiz</option>
          <option value="cantabria">Cantabria</option>
          <option value="castellon">Castellón</option>
          <option value="ciudad-real">Ciudad Real</option>
          <option value="cordoba">Córdoba</option>
          <option value="cuenca">Cuenca</option>
          <option value="girona">Girona</option>
          <option value="granada">Granada</option>
          <option value="guadalajara">Guadalajara</option>
          <option value="gipuzkoa">Gipuzkoa</option>
          <option value="huelva">Huelva</option>
          <option value="huesca">Huesca</option>
          <option value="illes-balears">Illes Balears</option>
          <option value="jaen">Jaén</option>
          <option value="leon">León</option>
          <option value="lleida">Lleida</option>
          <option value="lugo">Lugo</option>
          <option value="madrid">Madrid</option>
          <option value="malaga">Málaga</option>
          <option value="murcia">Murcia</option>
          <option value="navarra">Navarra</option>
          <option value="ourense">Ourense</option>
          <option value="palencia">Palencia</option>
          <option value="las-palmas">Las Palmas</option>
          <option value="pontevedra">Pontevedra</option>
          <option value="la-rioja">La Rioja</option>
          <option value="salamanca">Salamanca</option>
          <option value="santa-cruz-de-tenerife">Santa Cruz de Tenerife</option>
          <option value="segovia">Segovia</option>
          <option value="sevilla">Sevilla</option>
          <option value="soria">Soria</option>
          <option value="tarragona">Tarragona</option>
          <option value="teruel">Teruel</option>
          <option value="toledo">Toledo</option>
          <option value="valencia">Valencia</option>
          <option value="valladolid">Valladolid</option>
          <option value="bizkaia">Bizkaia</option>
          <option value="zamora">Zamora</option>
          <option value="zaragoza">Zaragoza</option>
        </select>
        <label for="fecha-nacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">
      </p>

      <p>
        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion">
        <label for="codigo-postal">Código postal:</label>
        <input type="text" id="codigo-postal" name="codigo-postal">
      </p>
    </fieldset>

    <fieldset>
      <legend>Forma de acceso</legend>

      <p>
        <input type="radio" id="acceso-directo" name="forma-acceso" value="directo">
        <label for="acceso-directo">Directo</label>
      </p>
      <ul>
        <li>
          <input type="radio" id="bachillerato" name="modalidad" value="bachillerato">
          <label for="bachillerato">Bachillerato Log. Modalidad:</label>
          <input type="text" name="modalidad-bachillerato" aria-label="Modalidad de bachillerato">
        </li>
        <li>
          <input type="radio" id="experimental" name="modalidad" value="experimental">
          <label for="experimental">Experimental</label>
        </li>
        <li>
          <input type="radio" id="cou" name="modalidad" value="cou">
          <label for="cou">COU Opción:</label>
          <input type="text" name="opcion-cou" aria-label="Opción de COU">
        </li>
        <li>
          <input type="radio" id="fp2" name="modalidad" value="fp2">
          <label for="fp2">FP2</label>
        </li>
        <li>
          <input type="radio" id="otros-estudios" name="modalidad" value="otros">
          <label for="otros-estudios">Otros (especifique):</label>
          <input type="text" name="otros-estudios" aria-label="Especifique otros estudios">
        </li>
      </ul>

      <p>
        <input type="radio" id="prueba-libre" name="forma-acceso" value="prueba-libre">
        <label for="prueba-libre">Prueba libre</label>
      </p>
    </fieldset>

    <fieldset>
      <legend>Documentos adjuntados</legend>
      <p>
        <input type="checkbox" id="fotocopia-dni" name="documentos" value="fotocopia-dni">
        <label for="fotocopia-dni">Fotocopia DNI</label>
        <input type="checkbox" id="certificado-academico" name="documentos" value="certificado-academico">
        <label for="certificado-academico">Certificado académico</label>
      </p>
      <p>
        <input type="checkbox" id="otros-documentos" name="documentos" value="otros">
        <label for="otros-documentos">Otros documentos (especifique):</label>
        <input type="text" name="otros-documentos" aria-label="Especifique otros documentos">
      </p>
    </fieldset>

    <p>
      <button type="submit">Enviar solicitud</button>
      <button type="reset">Limpiar datos</button>
    </p>
  </form>
</body>
</html>
