<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Miguel Moreno Morales">
  <meta name="description" content="Contacta con el restaurante Picanton Morales mediante este formulario.">
  <meta name="keywords" content="contacto, restaurante, Picanton Morales, formulario">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de contacto - Picanton Morales</title>
</head>
<body>
  <header>
    <h1>Formulario de contacto</h1>
    <nav aria-label="Navegación principal">
      <a href="index.html">Volver al restaurante</a>
      <a href="../index.html">Menú principal</a>
    </nav>
  </header>
  <main>
    <h2>Rellena el siguiente formulario para contactar con nosotros</h2>
    <form>
      <p>
        <label for="contacto-nombre">Su nombre:</label>
        <input type="text" id="contacto-nombre" name="nombre" autocomplete="name" required>
      </p>
      <p>
        <label for="contacto-correo">Su correo electrónico:</label>
        <input type="email" id="contacto-correo" name="correo" autocomplete="email" required>
      </p>
      <p>
        <label for="contacto-telefono">Su teléfono:</label>
        <input type="tel" id="contacto-telefono" name="telefono" autocomplete="tel">
      </p>
      <p>
        <label for="contacto-asunto">Asunto:</label>
        <input type="text" id="contacto-asunto" name="asunto" required>
      </p>
      <p>
        <label for="contacto-mensaje">Su mensaje:</label>
        <br>
        <textarea id="contacto-mensaje" name="mensaje" rows="8" cols="50" maxlength="500" required></textarea>
        <br>
        <small>Máximo 500 caracteres.</small>
      </p>
      <button type="submit">Enviar</button>
    </form>
  </main>
  <footer>
    <p><a href="index.html">Volver al menú del restaurante</a></p>
  </footer>
</body>
</html>
