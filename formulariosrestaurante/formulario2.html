<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de contacto</title>
</head>
<body>
  <h1>Envíenos su mensaje</h1>
  <p><a href="../Restaurante-Sabor-Mexicano/index_RESTAURANTE.html">Volver al restaurante</a></p>
  <p><a href="../index.html">Volver al inicio</a></p>

  <form>
    <p>
      <label for="nombre">Su nombre:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Su nombre">
    </p>
    <p>
      <label for="correo">Su correo electrónico:</label>
      <input type="email" id="correo" name="correo" placeholder="Su correo electrónico">
    </p>
    <p>
      <label for="telefono">Su teléfono:</label>
      <input type="tel" id="telefono" name="telefono" placeholder="Su teléfono">
    </p>
    <p>
      <label for="asunto">Asunto:</label>
      <input type="text" id="asunto" name="asunto" placeholder="Asunto">
    </p>
    <p>
      <label for="mensaje">Su mensaje:</label>
      <br>
      <textarea id="mensaje" name="mensaje" rows="8" cols="50" maxlength="500" placeholder="Su mensaje"></textarea>
      <br>
      <small>Máximo 500 caracteres.</small>
    </p>
    <button type="submit">Enviar</button>
  </form>
</body>
</html>
