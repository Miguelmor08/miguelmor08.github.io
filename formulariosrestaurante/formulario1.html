<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de reserva</title>
</head>
<body>
  <h1>Haz una reserva</h1>
  <p><a href="../Restaurante-Sabor-Mexicano/index_RESTAURANTE.html">Volver al restaurante</a></p>
  <p><a href="../index.html">Volver al index</a></p>

  <form>
    <p>
      <label for="nombre">Su nombre:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Su nombre">
    </p>
    <p>
      <label for="clientes">Número de clientes:</label>
      <input type="number" id="clientes" name="clientes" min="1" placeholder="Número de clientes">
    </p>
    <p>
      <label for="correo">Su correo electrónico:</label>
      <input type="email" id="correo" name="correo" placeholder="Su correo electrónico">
    </p>
    <p>
      <label for="telefono">Su teléfono:</label>
      <input type="tel" id="telefono" name="telefono" placeholder="Su teléfono">
    </p>
    <p>
      <label for="fecha">Fecha de la reserva:</label>
      <input type="date" id="fecha" name="fecha">
    </p>
    <p>
      <label for="hora">Hora de la reserva:</label>
      <input type="time" id="hora" name="hora">
    </p>
    <p>
      <label for="mensaje">Su mensaje:</label>
      <br>
      <textarea id="mensaje" name="mensaje" rows="4" cols="40"></textarea>
    </p>
    <button type="submit">Solicitar reserva</button>
  </form>

  <p>Consulte nuestra política de privacidad para saber cómo protegemos sus datos.</p>
</body>
</html>
